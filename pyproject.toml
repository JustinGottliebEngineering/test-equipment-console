[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "test-equipment-console"
version = "0.1.0"
description = "Desktop console for simulated and real test equipment communication"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Justin Gottlieb" }
]
dependencies = [
    "PySide6>=6.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0"
]

[project.scripts]
test-equipment-console = "test_equipment_console.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"